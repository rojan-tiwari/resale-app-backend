# =============================================================================
# ResaleMarket API - base configuration (all environments)
#
# Secrets are NEVER committed. They come from environment variables, or from a
# git-ignored `.env` file in the repository root (copy `.env.example`).
# Profile-specific settings live in application-dev.yml / application-prod.yml.
# =============================================================================
spring:
  application:
    name: resale-market-api

  profiles:
    default: dev                 # override with SPRING_PROFILES_ACTIVE=prod

  config:
    import:
      # Optional dotenv files: `backend/.env` when run from backend/, repository-root `.env` otherwise.
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:resale_market}}
    username: ${DB_USERNAME:resale}
    password: ${DB_PASSWORD}     # required - no default on purpose
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    open-in-view: false          # no lazy loading in controllers/serialisation
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only verifies the mapping matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC         # all timestamps are stored and exchanged in UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50   # avoids N+1 selects on lazy collections

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100       # clients cannot request huge pages

  servlet:
    multipart:
      max-file-size: 5MB         # per-image limit (Phase 3 also validates the real content type)
      max-request-size: 45MB     # 8 images + form fields

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness

app:
  cors:
    # Comma-separated list of exact origins allowed to call the API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
