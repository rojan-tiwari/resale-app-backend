# Development profile (default). Convenience over strictness - never use in production.
logging:
  level:
    com.resalemarket: DEBUG
    org.springframework.security: INFO

management:
  endpoint:
    health:
      show-details: always

app:
  auth:
    refresh-cookie:
      secure: false              # the dev server is plain http://localhost, where a Secure cookie would not be kept by every browser

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
