# Production profile: SPRING_PROFILES_ACTIVE=prod
# Required environment variables: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS
# (use an empty CORS_ALLOWED_ORIGINS when a reverse proxy serves the SPA and the API from one origin).
spring:
  datasource:
    url: ${DB_URL}               # no localhost fallback in production
    username: ${DB_USERNAME}

logging:
  level:
    root: INFO
    com.resalemarket: INFO

server:
  # Honour X-Forwarded-* from the reverse proxy / load balancer. `native` (Tomcat's RemoteIpValve) also makes the client's real IP
  # the request's remote address, which the rate limits count by; `framework` would leave every visitor looking like the proxy.
  # Only proxies on private addresses are trusted (server.tomcat.remoteip.internal-proxies), so a visitor cannot spoof it.
  forward-headers-strategy: native
  compression:
    enabled: true

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false               # do not publish the API surface in production
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
