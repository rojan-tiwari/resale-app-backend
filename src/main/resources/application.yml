# =============================================================================
# ResaleMarket API - base configuration (all environments)
#
# Secrets are NEVER committed. They come from environment variables, or from a
# git-ignored `.env` file in the repository root (copy `.env.example`).
# Profile-specific settings live in application-dev.yml / application-prod.yml.
# =============================================================================
spring:
  application:
    name: resale-market-api

  profiles:
    default: dev                 # override with SPRING_PROFILES_ACTIVE=prod

  config:
    import:
      # Optional dotenv files: `backend/.env` when run from backend/, repository-root `.env` otherwise.
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:resale_market}}
    username: ${DB_USERNAME:resale}
    password: ${DB_PASSWORD}     # required - no default on purpose
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    open-in-view: false          # no lazy loading in controllers/serialisation
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only verifies the mapping matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC         # all timestamps are stored and exchanged in UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50   # avoids N+1 selects on lazy collections

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100       # clients cannot request huge pages

  mail:
    # Only used when app.mail.transport=smtp (see below). Defaults point at Mailpit, the local mail catcher in docker-compose.yml.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Never let a slow mail server hold a worker thread forever (milliseconds).
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

  servlet:
    multipart:
      max-file-size: 5MB         # the web server's hard stop per photo; app.listing.max-image-size is the message-friendly limit below it
      max-request-size: 45MB     # 8 images + form fields

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness
  health:
    mail:
      enabled: false             # an unreachable mail server must not take the API out of the load balancer

app:
  frontend:
    # Where the web app lives. Goes into e-mailed links (the password-reset link opens a page of the web app).
    url: ${FRONTEND_URL:http://localhost:4200}
  mail:
    # `log` prints each message to the application log instead of sending it: for development only, because the log would
    # then hold working password-reset links. `smtp` sends through spring.mail.*; the prod profile fixes it to smtp.
    transport: ${MAIL_TRANSPORT:log}
    from: ${MAIL_FROM:ResaleMarket <no-reply@resalemarket.local>}
  storage:
    # Where uploaded photos are kept. `local` = a directory on this server's disk (back it up together with the database);
    # an S3-compatible implementation can replace it later without changes to the listing code.
    type: local
    root: ${STORAGE_ROOT:./data/uploads}
  listing:
    # false: a seller's listing goes live at once (moderation happens through reports). true: it waits in PENDING_REVIEW for an
    # administrator's approval first.
    require-review: ${LISTING_REQUIRE_REVIEW:false}
    max-image-size: 5MB          # keep at or below spring.servlet.multipart.max-file-size
    # Per signed-in user; rules: create, image-upload (`.attempts` / `.window`). The defaults are in ListingProperties.
  cors:
    # Comma-separated list of exact origins allowed to call the API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # Signing key of the access tokens: required, at least 32 bytes, no default on purpose (the API refuses to start
    # without it). Generate one with `openssl rand -hex 48`; `make setup` puts one in .env.
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
  auth:
    refresh-token-ttl: 14d       # sliding: every refresh starts a new period
    refresh-reuse-grace: 10s     # a just-rotated token presented again within this time is a tab race, not theft
    refresh-cookie:
      secure: true               # HTTPS only; the dev profile turns this off for http://localhost
      same-site: Strict
    password-reset-ttl: 1h       # how long the link in a password-reset e-mail works (it also works only once)
    max-failed-logins: 5         # this many wrong passwords in a row lock the account ...
    lockout-duration: 15m        # ... for this long (resetting the password lifts the lock at once)
    # Rate limits of the public auth endpoints are `app.auth.rate-limits.<rule>.attempts` / `.window`, rules: login, register,
    # forgot-password-by-ip, forgot-password-by-email, reset-password, change-password. The defaults are in AuthProperties.
