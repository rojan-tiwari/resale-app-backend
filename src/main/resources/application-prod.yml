# Production profile: SPRING_PROFILES_ACTIVE=prod
# Required environment variables: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS
# (use an empty CORS_ALLOWED_ORIGINS when a reverse proxy serves the SPA and the API from one origin).
spring:
  datasource:
    url: ${DB_URL}               # no localhost fallback in production
    username: ${DB_USERNAME}

logging:
  level:
    root: INFO
    com.resalemarket: INFO

server:
  forward-headers-strategy: framework   # honour X-Forwarded-* from the reverse proxy / load balancer
  compression:
    enabled: true

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false               # do not publish the API surface in production
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
